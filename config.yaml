    politics_bestsellers: /Best-Sellers-Kindle-Store-Politics-Social-Sciences/zgbs/digital-text/158519011
filters:
  max_price: 4.99
  # BookBub-style limited-time gate: only surface books at least this % off
  # their list price (a real discount, not just a cheap price).
  min_savings_pct: 50
  topics:
  - science
  - physics
  - math
  - biology
  - chemistry
  - astronomy
  - cosmology
  - history
  - philosophy
  - biography
  - memoir
  - economics
  - psychology
  - neuroscience
  - anthropology
  - sociology
  - politics
  - nature
  - evolution
  - quantum
  - genetics
  - war
  - empire
  - civilization
  - universe
  - brain
  - mind
  - theory
  - discovery
  - true story
  - how to
  - guide to
  - secret
  - einstein
  - darwin
  - feynman
  - hawking
  - sagan
  - dna
  - planet
  - earth
  - space
  - time
  - relativity
  - algorithm
  - artificial intelligence
  - machine learning
  - statistics
  - code
  - cryptography
  exclude_patterns:
  - 'book\s+\d+'
  - 'book\s+(one|two|three|four|five|six|seven|eight|nine|ten)'
  - 'series\s+book'
  - '#\d+'
  - 'vol(?:ume)?\s+\d+'
  exclude_keywords:
  # Original (kept)
  - romantasy
  - vampire
  - werewolf
  - dragon
  - magic
  - witch
  - wizard
  - sorcerer
  - demon
  - necromancer
  - exorcist
  - fae
  - fairy
  - shifter
  - mage
  # Core additions
  - novel
  - romance
  - trilogy
  - saga
  - fiction
  # Book formats
  - novella
  - short story
  - a novel
  - chronicles
  # Fantasy subgenres
  - dark fantasy
  - urban fantasy
  - epic fantasy
  - high fantasy
  - portal fantasy
  - sword and sorcery
  - litrpg
  - gamelit
  - grimdark
  # Romance subgenres
  - paranormal romance
  - dark romance
  - shifter romance
  - mm romance
  - enemies to lovers
  # Romance tropes
  - alpha male
  - harem
  - steamy
  - billionaire
  # Horror/supernatural
  - horror
  - gothic
  - supernatural
  - paranormal
  - ghost story
  - haunted house
  - zombie
  - apocalypse
  - post-apocalyptic
  # Sci-fi
  - dystopian
