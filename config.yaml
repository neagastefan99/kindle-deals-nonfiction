  - thriller
  - murder mystery
  - cozy mystery
  - detective
  - crime fiction
  # Expanded fantasy creatures
  - vampires
  - werewolves
  - dragons
  - dungeons
  - elves
  - dwarves
  - orcs
  # Magic systems
  - sorcery
  - witchcraft
  - spellbook
  - grimoire
  - necromancy
  # Common tropes
  - immortal
  - lucifer
  - prophecy
  - chosen one
  - dark lord
  tracked_authors: []
scraping:
  request_delay: 4  # 4s + jitter = 2-6s — raised from 2s to dodge Amazon 503 rate-limit
  user_agents:
  - Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/124.0.0.0 Safari/537.36
  - Mozilla/5.0 (Macintosh; Intel Mac OS X 14_4) AppleWebKit/605.1.15 (KHTML, like
    Gecko) Version/17.4 Safari/605.1.15
  max_books_per_source: 50
  engine: lightpanda
  auto_fallback: true
  # product_engine: which transport fetches PRODUCT pages for enrichment.
  # curl_cffi (default): lightpanda's UA ("Lightpanda/1.0") is fingerprintable
  # by Amazon's bot detection, which serves the validateCaptcha interstitial on
  # ~75% of product-page requests (probabilistic; wait_ms doesn't help).
  # curl_cffi's chrome124 impersonation + US cookie jar passes ~100%.
  product_engine: curl_cffi
  lightpanda_bin: /home/stefan/.local/bin/lightpanda
  lightpanda_cookies: /tmp/lightpanda-cookies.json
  lightpanda_wait_ms: 6000
  lightpanda_retries: 3           # attempts for retryable failures (HTTP 429/5xx)
  lightpanda_retry_backoff: [5, 15, 30]   # seconds between retry attempts
  # debug: true → per-URL failure dumps in the log (normal runs summarize per batch)
  debug: false
covers:
  enabled: true
  max_count: 10
  dir: data/covers
